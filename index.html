<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HARIOM MODDER - Official Mod Store</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--neon:#00ff88;--bg:#080808;--card:#151515;--border:#222}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:var(--bg);color:#fff}
header{position:sticky;top:0;z-index:100;background:rgba(10,10,10,0.95);backdrop-filter:blur(10px);padding:12px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--neon)}
.logo{font-family:'Orbitron';font-weight:900;color:var(--neon);font-size:18px;letter-spacing:1.5px;cursor:pointer}
#search{width:45%;max-width:250px;padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:#111;color:#fff;outline:none}
.admin-bar{display:none;background:#111;border:1px dashed var(--neon);margin:15px;border-radius:12px;padding:15px}
.admin-bar.active{display:block}
.admin-bar input{width:100%;padding:11px;margin:6px 0;border-radius:8px;border:none;background:#1f1f1f;color:#fff;outline:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{padding:11px;border-radius:8px;border:none;font-weight:800;cursor:pointer;width:100%;margin-top:8px}
.btn-add{background:var(--neon);color:#000}
.container{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;padding:12px;min-height:80vh}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;text-align:center;position:relative}
.card img{width:72px;height:72px;border-radius:16px;object-fit:cover}
.card h3{font-size:13px;margin:10px 0 4px;height:32px;overflow:hidden}
.meta{font-size:11px;color:#888}
.dl{display:block;background:var(--neon);color:#000;padding:8px;margin-top:10px;border-radius:8px;font-weight:800;font-size:13px;cursor:pointer}
.three{position:absolute;top:6px;right:10px;cursor:pointer;font-size:20px;padding:5px}
.menu{position:absolute;top:30px;right:10px;background:#222;border-radius:8px;display:none;z-index:20;min-width:130px;border:1px solid #333;overflow:hidden}
.menu.show{display:block}
.menu button{width:100%;background:none;border:none;color:#fff;padding:10px;text-align:left;font-size:12px}
#dl-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:999;justify-content:center;align-items:center;padding:20px}
#dl-box{background:#151515;border:1px solid var(--neon);border-radius:18px;width:100%;max-width:360px;padding:20px;text-align:center}
#dl-bar{height:10px;background:#222;border-radius:20px;margin:15px 0;overflow:hidden}
#dl-fill{height:100%;width:0%;background:var(--neon);transition:width 0.2s}
#badge{display:none;background:red;color:#fff;font-size:10px;padding:2px 6px;border-radius:10px;margin-left:6px}
</style>
</head>
<body>
<header>
  <div class="logo" id="logoTap">HARIOM MODDER <span id="badge">ADMIN</span></div>
  <input id="search" placeholder="Search mod...">
</header>
<div class="admin-bar" id="adminBar">
  <h3 style="color:var(--neon);font-family:Orbitron">⋮ ADMIN PANEL</h3>
  <input id="a_name" placeholder="App Name">
  <div class="row"><input id="a_ver" placeholder="Version"><input id="a_size" placeholder="Size"></div>
  <input id="a_icon" placeholder="ICON Direct Link">
  <input id="a_drive" placeholder="GOOGLE DRIVE LINK">
  <button class="btn btn-add" id="addBtn">+ UPLOAD TO FIREBASE</button>
  <button class="btn" style="background:#222;color:#fff;border:1px solid #333" onclick="logoutAdmin()">Exit</button>
  <div id="adminList" style="margin-top:12px;font-size:12px"></div>
</div>
<div class="container" id="list"></div>
<div id="dl-overlay"><div id="dl-box">
  <img id="dl-icon" src=""><h3 id="dl-name" style="margin:10px 0 4px"></h3><p id="dl-meta" style="font-size:12px;color:#888"></p>
  <div id="dl-bar"><div id="dl-fill"></div></div>
  <div style="display:flex;justify-content:space-between;font-size:12px"><span id="dl-speed">0 MB/s</span><span id="dl-percent">0%</span></div>
  <p id="dl-status" style="font-size:11px;color:#00ff88;margin-top:10px">Connecting...</p>
  <button class="btn" style="background:#222;color:#fff" onclick="closeDl()">Cancel</button>
</div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
const firebaseConfig = {
  apiKey: "AIzaSyDqVPnKIwuJzJVOaGqTzD4IIFysVpJ6g4Y",
  authDomain: "website-hariom.firebaseapp.com",
  databaseURL: "https://website-hariom-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "website-hariom",
  storageBucket: "website-hariom.firebasestorage.app",
  messagingSenderId: "602644625906",
  appId: "1:602644625906:web:7db11a4e6eb16beeb7536b",
  measurementId: "G-CEPT6GQZQS"
};
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const db = getDatabase(app);
const appsRef = ref(db, 'apps');
let appsData = {}; let isAdmin = localStorage.getItem('hm_admin')==='1'; let tap=0;
document.getElementById('logoTap').addEventListener('click',()=>{tap++;setTimeout(()=>tap=0,2000);if(tap>=5){if(isAdmin)toggleAdmin(true);else{let p=prompt("Admin Password:");if(p==="HARIOM123"){localStorage.setItem('hm_admin','1');isAdmin=true;toggleAdmin(true);}}tap=0;}});
function toggleAdmin(s){const bar=document.getElementById('adminBar');if(s)bar.classList.add('active');else bar.classList.toggle('active');document.getElementById('badge').style.display=isAdmin?'inline':'none';}
window.logoutAdmin=()=>{localStorage.removeItem('hm_admin');isAdmin=false;document.getElementById('adminBar').classList.remove('active');document.getElementById('badge').style.display='none';render();};
function getDirect(link){if(link.includes("drive.google.com")){const m=link.match(/\/d\/([^/]+)/)||link.match(/id=([^&]+)/);if(m)return`https://drive.google.com/uc?export=download&id=${m[1]}`;}return link;}
onValue(appsRef,(snap)=>{appsData=snap.val()||{};render();});
function render(filter=""){const el=document.getElementById('list');const entries=Object.entries(appsData);if(entries.length===0){el.innerHTML="<p style='grid-column:1/-1;text-align:center;color:#666;margin-top:50px'>No Apps Yet</p>";return;}el.innerHTML="";entries.reverse().forEach(([key,a])=>{if(!a.name.toLowerCase().includes(filter.toLowerCase()))return;el.innerHTML+=`<div class="card"><div class="three" onclick="window.openMenu('${key}')">⋮<div class="menu" id="menu-${key}"><button onclick="window.shareApp('${a.name}','${a.drive}')">Share</button>${isAdmin?`<button onclick="window.deleteApp('${key}')" style="color:#ff5555">Delete</button>`:``}</div></div><img src="${a.icon}"><h3>${a.name}</h3><div class="meta">${a.version} • ${a.size}</div><div class="dl" onclick="window.startDownload('${key}')">DOWNLOAD</div></div>`;});}
window.openMenu=(k)=>{document.querySelectorAll('.menu').forEach(m=>{if(m.id!==`menu-${k}`)m.classList.remove('show');});document.getElementById(`menu-${k}`).classList.toggle('show');}
window.deleteApp=(k)=>{if(confirm("Delete?"))remove(ref(db,'apps/'+k));}
window.shareApp=(n,l)=>{navigator.clipboard.writeText(l);alert("Link Copied");}
let dlInterval=null;
window.startDownload=(key)=>{const a=appsData[key];const overlay=document.getElementById('dl-overlay');document.getElementById('dl-icon').src=a.icon;document.getElementById('dl-name').innerText=a.name;document.getElementById('dl-meta').innerText=a.version+" • "+a.size;document.getElementById('dl-fill').style.width="0%";overlay.style.display="flex";let p=0;clearInterval(dlInterval);dlInterval=setInterval(()=>{p+=Math.random()*12+2;if(p>=100){p=100;clearInterval(dlInterval);document.getElementById('dl-fill').style.width="100%";document.getElementById('dl-percent').innerText="100%";setTimeout(()=>{closeDl();window.open(getDirect(a.drive),"_blank");},500);return;}document.getElementById('dl-fill').style.width=p+"%";document.getElementById('dl-percent').innerText=Math.floor(p)+"%";document.getElementById('dl-speed').innerText=(Math.random()*3+1).toFixed(1)+" MB/s";},200);}
window.closeDl=()=>{document.getElementById('dl-overlay').style.display="none";clearInterval(dlInterval);}
document.getElementById('search').addEventListener('input',e=>render(e.target.value));
document.getElementById('addBtn').addEventListener('click',()=>{const obj={name:document.getElementById('a_name').value.trim(),version:document.getElementById('a_ver').value.trim()||"v1.0",size:document.getElementById('a_size').value.trim()||"100 MB",icon:document.getElementById('a_icon').value.trim()||"https://cdn-icons-png.flaticon.com/512/888/888879.png",drive:document.getElementById('a_drive').value.trim(),time:Date.now()};if(!obj.name||!obj.drive)return alert("Name + Drive zaruri");push(appsRef,obj).then(()=>{alert("Uploaded!");document.getElementById('a_name').value="";document.getElementById('a_drive').value="";});});
if(isAdmin)toggleAdmin(true);
</script>
</body>
</html>
